- name: Install Docker, Docker Compose, and the Python library Ansible's Docker modules need
  ansible.builtin.dnf:
    name:
      - docker
      - docker-compose
      - python3-requests
    state: present

- name: Start Docker now and on every boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create the Docker CLI plugins folder
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Install the Docker Compose plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"

- name: Let ec2-user run docker without sudo
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
