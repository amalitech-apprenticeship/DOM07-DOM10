- name: Install Docker and the Python library Ansible's Docker modules need
  ansible.builtin.dnf:
    name:
      - docker
      - python3-requests
    state: present

- name: Start Docker now and on every boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Let ec2-user run docker without sudo
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
