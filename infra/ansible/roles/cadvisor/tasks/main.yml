- name: Run cAdvisor (per-container metrics)
  community.docker.docker_container:
    name: cadvisor
    image: "{{ cadvisor_image }}"
    state: started
    restart_policy: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    published_ports:
      - "{{ cadvisor_port }}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
