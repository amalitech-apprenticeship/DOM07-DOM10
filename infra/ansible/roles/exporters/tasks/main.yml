# roles/exporters/tasks/main.yml
- name: Run Node Exporter (host metrics)
  community.docker.docker_container:
    name: node_exporter
    image: "{{ exporters_node_exporter_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    pid_mode: host
    volumes:
      - /:/host:ro,rslave
    command: --path.rootfs=/host

- name: Run cAdvisor (per-container metrics)
  community.docker.docker_container:
    name: cadvisor
    image: "{{ exporters_cadvisor_image }}"
    state: started
    restart_policy: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    published_ports:
      - "{{ exporters_cadvisor_port }}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
